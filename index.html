<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồng hồ đếm ngược 4 phút có tiếng Tic Tắc</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h2 { font-size: 20px; color: #38bdf8; margin-bottom: 15px; }
    
    .display {
      font-family: 'Courier New', monospace;
      font-size: 54px;
      font-weight: bold;
      color: #38bdf8;
      background: #0f172a;
      padding: 15px 0;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }
    .display.finished { 
      color: #ef4444; 
      border-color: #ef4444;
      animation: blink 0.8s infinite; 
    }
    @keyframes blink { 50% { opacity: 0.3; } }
    
    /* Tùy chỉnh bật/tắt tiếng tic tắc */
    .sound-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #94a3b8;
      cursor: pointer;
    }
    .sound-toggle input {
      accent-color: #38bdf8;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .row-btn { display: flex; gap: 8px; }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s;
    }
    .btn-start { background: #22c55e; }
    .btn-pause { background: #eab308; }
    .btn-reset { background: #64748b; }
    .btn-stop-alarm { 
      background: #ef4444; 
      display: none;
      width: 100%;
      font-size: 16px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Đếm Ngược 4 Phút</h2>
    <div class="display" id="display">04:00</div>
    
    <!-- Tùy chọn âm thanh tic tắc -->
    <label class="sound-toggle">
      <input type="checkbox" id="toggle-tick" checked>
      Bật tiếng tic tắc từng giây ⏱️
    </label>

    <div class="controls">
      <!-- Nút tắt chuông khi hết giờ -->
      <button class="btn-stop-alarm" id="btn-stop-alarm">🔔 Tắt Tiếng Chuông</button>

      <div class="row-btn">
        <button class="btn-start" id="btn-start">Bắt đầu</button>
        <button class="btn-pause" id="btn-pause" disabled>Tạm dừng</button>
        <button class="btn-reset" id="btn-reset">Đặt lại</button>
      </div>
    </div>
  </div>

  <!-- Thẻ âm thanh chuông báo khi đếm xong -->
  <audio id="alarm-sound" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <script>
    const INITIAL_SECONDS = 4 * 60; // 4 phút = 240 giây
    let totalSeconds = INITIAL_SECONDS;
    let timerInterval = null;
    let webAudioInterval = null;
    let audioCtx = null;

    const display = document.getElementById('display');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');
    const btnStopAlarm = document.getElementById('btn-stop-alarm');
    const toggleTick = document.getElementById('toggle-tick');
    const alarmAudio = document.getElementById('alarm-sound');

    // Khởi tạo AudioContext khi có tương tác người dùng
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Hàm tạo tiếng Tic Tắc cơ học nhịp nhàng
    function playTickSound(isTack = false) {
      if (!toggleTick.checked) return; // Nếu bỏ tích thì không phát tiếng

      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Thay đổi tần số giữa tiếng "Tic" (cao) và "Tắc" (thấp hơn)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isTack ? 750 : 1200, ctx.currentTime);

        // Tạo xung âm thanh cực ngắn (0.02 giây) giống tiếng gõ cơ học
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.02);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.02);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // Âm thanh báo động dự phòng
    function playFallbackChime() {
      const ctx = getAudioContext();
      const playSingleRing = () => {
        [523.25, 659.25, 783.99, 1046.50].forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);
          osc.start();
          osc.stop(ctx.currentTime + 1.5);
        });
      };
      
      playSingleRing();
      webAudioInterval = setInterval(playSingleRing, 1200);
    }

    function startAlarm() {
      btnStopAlarm.style.display = 'block';
      alarmAudio.play().catch(() => {
        playFallbackChime();
      });
    }

    function stopAlarm() {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
      if (webAudioInterval) {
        clearInterval(webAudioInterval);
        webAudioInterval = null;
      }
      btnStopAlarm.style.display = 'none';
    }

    function updateDisplay() {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    btnStart.addEventListener('click', () => {
      stopAlarm();
      getAudioContext(); // Kích hoạt Audio Context khi nhấn bắt đầu
      if (totalSeconds <= 0) return;

      btnStart.disabled = true;
      btnPause.disabled = false;

      timerInterval = setInterval(() => {
        totalSeconds--;
        updateDisplay();

        // Phát tiếng "Tic" ở giây lẻ và "Tắc" ở giây chẵn
        playTickSound(totalSeconds % 2 === 0);

        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          display.classList.add('finished');
          startAlarm(); // Phát chuông khi hết giờ
          btnStart.disabled = false;
          btnPause.disabled = true;
        }
      }, 1000);
    });

    btnPause.addEventListener('click', () => {
      clearInterval(timerInterval);
      timerInterval = null;
      btnStart.disabled = false;
      btnPause.disabled = true;
    });

    btnReset.addEventListener('click', () => {
      clearInterval(timerInterval);
      timerInterval = null;
      stopAlarm();
      
      totalSeconds = INITIAL_SECONDS;
      display.classList.remove('finished');
      updateDisplay();
      
      btnStart.disabled = false;
      btnPause.disabled = true;
    });

    btnStopAlarm.addEventListener('click', stopAlarm);

    updateDisplay();
  </script>

</body>
</html>
